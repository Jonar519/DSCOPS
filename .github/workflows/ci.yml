name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, types, tests and generated artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Install uv and Python 3.12
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.7"
          python-version: "3.12"
          enable-cache: true

      - name: Sync locked environment
        run: uv sync --locked --extra dev

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy src

      - name: Tests and coverage
        run: uv run pytest --cov=dscops --cov-report=term-missing --cov-fail-under=80

      - name: Validate examples with the compiler itself
        run: uv run dscops check examples/*.dscops

      - name: Build all artifacts
        run: uv run dscops build examples/app.dscops --target compose,kubernetes,github,terraform --out dist

      - name: Validate Compose output
        env:
          DB_URL: postgresql://main:ci@main:5432/main
          MAIN_PASSWORD: ci
          CACHE_PASSWORD: ci
        run: docker compose -f dist/compose.yaml config --quiet

      - name: Validate Kubernetes output
        run: |
          docker run --rm \
            -v "$PWD/dist:/dist" \
            ghcr.io/yannh/kubeconform:v0.8.0 \
            -strict -summary /dist/k8s.yaml

      - uses: actions/upload-artifact@v4
        with:
          name: dscops-artifacts
          path: dist/
          if-no-files-found: error
          include-hidden-files: true

  security:
    name: OWASP Top 10 and supply chain
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Install uv and Python 3.12
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.7"
          python-version: "3.12"
          enable-cache: true

      - name: Sync locked environment
        run: uv sync --locked --extra dev

      - name: Bandit SAST
        run: uvx bandit -r src -ll -q

      - name: Semgrep OWASP Top 10
        run: uvx --from semgrep semgrep --config p/owasp-top-ten --error --metrics=off src

      - name: Dependency CVEs
        run: |
          uv export --frozen --extra dev --no-emit-project --format requirements-txt --no-hashes -o "${RUNNER_TEMP}/requirements.txt"
          uvx pip-audit --strict -r "${RUNNER_TEMP}/requirements.txt"

      - name: Secret scan
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz" \
            | tar -xz -C "${RUNNER_TEMP}" gitleaks
          "${RUNNER_TEMP}/gitleaks" detect --source . --no-git --redact --no-banner

      - name: Trivy filesystem, lockfile and Dockerfile
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          hide-progress: true

  sonar:
    name: SonarQube
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Decide if SonarQube can run
        id: sonar
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        run: |
          if [ -n "$SONAR_TOKEN" ] && [ -n "$SONAR_HOST_URL" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "SonarQube omitido: faltan los secrets SONAR_TOKEN y SONAR_HOST_URL."
            echo "SonarCloud usa SONAR_HOST_URL=https://sonarcloud.io y la variable SONAR_ORGANIZATION."
          fi

      - name: Install uv and Python 3.12
        if: steps.sonar.outputs.enabled == 'true'
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.13.7"
          python-version: "3.12"
          enable-cache: true

      - name: Coverage for SonarQube
        if: steps.sonar.outputs.enabled == 'true'
        run: |
          uv sync --locked --extra dev
          uv run pytest --cov=dscops --cov-report=xml --cov-fail-under=80

      - name: SonarQube scan
        if: steps.sonar.outputs.enabled == 'true'
        uses: SonarSource/sonarqube-scan-action@v8.4.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
        with:
          args: >-
            ${{ vars.SONAR_ORGANIZATION != '' && format('-Dsonar.organization={0}', vars.SONAR_ORGANIZATION) || '' }}

  docker:
    name: Build API image
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: quality
    steps:
      - uses: actions/checkout@v7

      - name: Build non-root API image
        run: docker build -t dscops-api:ci .

      - name: Smoke test API health
        run: |
          docker run -d --name dscops-api -p 8000:8000 dscops-api:ci
          for _ in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8000/health; then
              exit 0
            fi
            sleep 1
          done
          docker logs dscops-api
          exit 1

      - name: Trivy image scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: dscops-api:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          hide-progress: true

      - name: Stop API container
        if: always()
        run: docker rm -f dscops-api || true
